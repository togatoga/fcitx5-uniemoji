# Karukan IME デフォルト設定
# このファイルは ~/.config/karukan-im/config.toml にコピーして使用してください

[conversion]
# 変換ストラテジー: adaptive（動的切替）, light（軽量モデルのみ）, main（メインモデルのみ）
strategy = "adaptive"
# 変換候補数（Space押下時）
num_candidates = 9
# 周辺テキスト（カーソル左側の確定済みテキスト）を変換時のコンテキストとして使用する
use_context = true
# 変換API に渡す周辺テキストの最大文字数
context_chars = 10
# 一度にAI変換する Chunk の最大文字数。長文を入力しても1キーあたりの変換時間が
# 伸びないようにするための区切り。詳細は docs/chunking.md を参照。
chunk_chars = 30
# ひと続きで変換する Chunk に残せる記号（、。！？など）の数。
# この数までの記号は区切らずに一緒に変換されるため、「おい、お前だよ」が
# 読点を入力した時点で「老、」に固定されず、最後までまとめて変換される。
# 0 にすると記号のたびに区切る。
chunk_symbols = 1

# Chunk に残せる数字の桁数。既定の 0 は数字をAI変換にかけず、入力された
# とおりに表示する（AI推論は桁を欠落・重複させることがあるため）。
# 「だい3かい」のように数字を含めて変換したい場合に増やす。
# 記号と同じ数え方で、収まる桁だけ残して超えた桁から新しい Chunk になる。
chunk_digits = 0

# Chunk に残せる英字の数。既定の 0 は英字をAI変換にかけず、入力された
# とおりに表示する。「Rustで」のように英字と日本語をまとめて変換したい場合に
# 増やすが、入力途中のローマ字（「わせだd」の d）も一緒にAIに渡るようになる。
chunk_alphabets = 0
# 別候補（ビームサーチ）を出す範囲の文字数。Chunk の切れ目に合わせて末尾から
# まとめるため、実際の範囲はこの値以下、かつ最後の Chunk 以上になる。
# 数字・記号の Chunk と、自分で入れた区切りが境界になる。
beam_chars = 30
# 別候補の本数（ビーム幅）
beam_width = 3
# メインモデルの推論がこの時間(ms)を超えたらlight_modelに自動切替(0で無効)
max_latency_ms = 100
# Model variant id or GGUF path (uses registry default if unset)
model = "jinen-v2-small-q5"
# Beam search model for Space conversion (uses default model only if unset)
light_model = "jinen-v2-xsmall-q5"
# 推論スレッド数（0 = 全コア使用）
n_threads = 4
# 起動時にライブ変換を有効にする（Ctrl+Shift+L で実行中も切替可能）
live_conversion = true
# ユーザー辞書: ~/.local/share/karukan-im/user_dicts/ に辞書ファイルを配置（Mozc TSV or KRKN binary）

[learning]
# 変換学習を有効にする
enabled = true
# 学習エントリの最大数
max_entries = 10000
# 学習する変換結果の最大文字数
max_surface_chars = 50

[display]
# 補助テキストに詳細（別候補の範囲・推論時間・モデル名・文脈）を表示する。
# Ctrl+Shift+V でいつでも切り替えられる。
verbose = false
# 候補ウィンドウのレイアウト。type と、そのレイアウトが使うパラメータを
# ひとつの値として書く（vertical にパラメータはない）:
#   縦一列（既定・番号つき）: candidate_layout = { type = "vertical" }
#   グリッド表示:            candidate_layout = { type = "grid", columns = 5, rows = 5 }
# grid は 1 ページに columns × rows 個の候補を並べる（macOS の日本語入力や
# MS-IME の「候補の一覧表示」に相当）。columns / rows は省略すると 5。
# 番号は表示されないが、Ctrl+1〜9 での選択は先頭 9 候補にそのまま使える。
# grid 中の移動: ←→↑↓ / Ctrl+B・F（左右）/ Ctrl+N・P（上下）/
# Ctrl+A・E（行頭・行末）。Space・Tab は従来どおり次候補、
# PageUp/PageDown はページ移動。
candidate_layout = { type = "vertical" }

# どのキーがどの記号を入力するか。幅（半角・全角）は [width] が決める。
[symbol]
# 「,」「.」キーが入力する句読点: "、。" / "，．" / "、．" / "，。"
punctuation = "、。"
# 「[」「]」キーが入力する括弧: "「」" / "[]"
bracket = "「」"
# 「/」キーが入力する記号: "・" / "/"
slash = "・"
# かな入力中にスペースキーが入力する空白: "half"（半角）/ "full"（全角）
# 入力中は Space が変換にあたるため、空白を挟むときは Shift+Space を使う
# （こちらもこの設定に従うので、半角スペースを含めて変換できる）。
# 何も入力していないときの Shift+Space だけは例外で、設定に関わらず全角。
# AI変換の結果に含まれる空白もこの設定に揃える。
# 英字モード・絵文字モードでは常に半角。
space = "half"

# かな入力中に出力される文字の幅。文字の種類ごとに "half"（半角）か
# "full"（全角）で指定する。英字モード（Shift+英字）と絵文字モードは対象外で、
# 打ったとおりの半角が出る。詳細は docs/symbols.md を参照。
[width]
# 対象: 。、「」・      半角にすると ｡､｢｣･
# この5文字だけ ASCII に対応する文字がなく、半角形は半角カタカナと組で使う
# 字形（ｱｲｳ｡）しかない。そのため他の記号と分けている
kana_symbol = "full"
# 対象: ?! ,. (){}[] <>=+-/* "' :; ~ #%&@$^_|`\ とその全角形
# 既定の全角で「（あ）」「あ？」「あ＠b」になる
ascii_symbol = "full"
# 対象: 0-9
# 全角にすると「へや１２３」になる。既定が半角なのは、確定するたびに選んだ幅を
# 覚える仕組みがなく、全角固定にすると取り消しがきかないから
digit = "half"
# 英字に設定はありません。かな入力中の英字は入力途中のローマ字（「わせだd」の d）
# か辞書の表記のどちらかで、どちらも勝手に幅を変えるものではないため。
# 全角の英字は候補一覧の ＡＢＣ（[全]英大文字）から選べます。

# 日付・時刻の変換。フレーズの読みを変換すると、今日±offset_days の日時を
# formats で描画した候補が出る（候補一覧の後方と Ctrl+R のビュー）。
# 確定しても学習履歴には残らない。詳細は docs/date.md を参照。
#
# フォーマットは {YEAR}（4桁）、{MONTH} {DATE} {HOUR} {MINUTE}（2桁ゼロ埋め）、
# {ERA}（令和）{ERA_YEAR}（8）{WEEKDAY}（土）{HOUR12}{AMPM}（午後3）、
# {{} はリテラルの「{」。数値トークンは :bare でゼロ埋めなし（9月）、
# :kanji で漢数字（九月、二〇二六）。
[date]
# formats を持たないフレーズが共通で使うフォーマット
formats = [
    "{YEAR}/{MONTH}/{DATE}",
    "{YEAR}-{MONTH}-{DATE}",
    "{YEAR}年{MONTH:bare}月{DATE:bare}日",
    "{ERA}{ERA_YEAR}年{MONTH:bare}月{DATE:bare}日",
    "{MONTH:bare}月{DATE:bare}日",
    "{MONTH:bare}月{DATE:bare}日({WEEKDAY})",
    "{WEEKDAY}曜日",
]

# フレーズ一覧。formats を書いたフレーズはそれだけを使い、書かないフレーズは
# 上の共有フォーマットを使う（offset_days は省略すると 0）。
# ユーザー設定に phrases を書くとこの一覧は丸ごと置き換わるので、
# 増やしたいときはこの一覧をコピーして編集する。
phrases = [
    { reading = "きょう", offset_days = 0 },
    { reading = "きのう", offset_days = -1 },
    { reading = "おととい", offset_days = -2 },
    { reading = "あした", offset_days = 1 },
    { reading = "あす", offset_days = 1 },
    { reading = "あさって", offset_days = 2 },
    { reading = "しあさって", offset_days = 3 },
    { reading = "いま", formats = ["{HOUR}:{MINUTE}", "{HOUR:bare}時{MINUTE:bare}分", "{AMPM}{HOUR12}時{MINUTE:bare}分"] },
    { reading = "にちじ", formats = ["{YEAR}/{MONTH}/{DATE} {HOUR}:{MINUTE}", "{YEAR}年{MONTH:bare}月{DATE:bare}日{HOUR:bare}時{MINUTE:bare}分"] },
]
